name: Build Fox Windows MSI

on:
  workflow_dispatch:
  push:
    paths:
      - "FoxNewest.7z"
      - "installer/**"
      - ".github/workflows/build-fox-msi.yml"
      - "fox.py"
      - "helpers/**"
    branches: [main]
  pull_request:
    paths:
      - "FoxNewest.7z"
      - "installer/**"
      - ".github/workflows/build-fox-msi.yml"
      - "fox.py"
      - "helpers/**"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and WiX
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          dotnet tool install --global wix --version 5.*
          wix extension add WixToolset.Util.wixext/5.0.2

      - name: Extract current Fox compiler source archive
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) { throw "7-Zip was not installed" }
          if (!(Test-Path "FoxNewest.7z")) { throw "FoxNewest.7z is missing; refusing to fall back to the backup archive." }
          $sourceRoot = "$env:RUNNER_TEMP\FoxSource"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          & $sevenZip x "FoxNewest.7z" "-o$sourceRoot" -y
          if ($LASTEXITCODE -ne 0) { throw "Could not extract FoxNewest.7z" }
          $compiler = Get-ChildItem $sourceRoot -Filter "fox.py" -File -Recurse | Select-Object -First 1
          if (!$compiler) { throw "FoxNewest.7z does not contain fox.py" }
          $helperDir = Get-ChildItem $sourceRoot -Directory -Recurse | Where-Object { $_.Name -eq "helpers" } | Select-Object -First 1
          if (!$helperDir) {
            Write-Host "Archive folders:"
            Get-ChildItem $sourceRoot -Directory -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "FoxNewest.7z is missing a helpers folder"
          }
          $helperFolder = $helperDir.FullName
          "FOX_SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOX_COMPILER=$($compiler.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FOX_HELPERS=$helperFolder" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload extracted FoxNewest source for audit
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: foxnewest-source-audit
          path: ${{ env.FOX_SOURCE_ROOT }}
          if-no-files-found: error
          retention-days: 1

      - name: Build standalone compiler
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name fox --console --distpath "$env:GITHUB_WORKSPACE\dist" --workpath "$env:RUNNER_TEMP\pyinstaller-work" --specpath "$env:RUNNER_TEMP" --add-data "$env:FOX_HELPERS;helpers" "$env:FOX_COMPILER"
          if (!(Test-Path "dist/fox.exe")) { throw "PyInstaller did not produce dist/fox.exe" }

      - name: Smoke test CLI
        shell: pwsh
        run: |
          & "dist/fox.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "fox.exe --help failed" }

      - name: Compile mouse/window demo to native PE32+
        shell: pwsh
        run: |
          python "$env:FOX_COMPILER" installer/mouse_capture_demo.fox --compile-only -o "$env:RUNNER_TEMP\fox-mouse-smoke.exe"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP\fox-mouse-smoke.exe")) { throw "FoxNewest.7z does not support the mouse/window demo yet" }

      - name: Build MSI
        shell: pwsh
        run: |
          wix build installer/Fox.wxs -ext WixToolset.Util.wixext -d PublishDir="$((Resolve-Path dist).Path)" -arch x64 -o Fox-Setup-x64.msi
          if (!(Test-Path "Fox-Setup-x64.msi")) { throw "WiX did not produce the MSI" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fox-Setup-x64
          path: Fox-Setup-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish or refresh the stable installer release
        if: github.event_name != 'release' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.0"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag Fox-Setup-x64.msi --clobber
          } else {
            gh release create $tag Fox-Setup-x64.msi --title "Fox 0.3.0 for Windows" --notes-file CHANGELOG.md
          }

      - name: Attach installer to the release that triggered this run
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" Fox-Setup-x64.msi --clobber
